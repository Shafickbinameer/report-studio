<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Studio</title>
    <link rel="icon" type="image/png" href="./asset/images/icon.png">
    <link rel="stylesheet" href="./shared/theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700&family=Instrument+Sans:ital,wght@0,400..700&display=swap"
        rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-content: center;
            gap: 20px;
            background: var(--backdrop);
            font-family: "Instrument Sans", system-ui, sans-serif;
            color: var(--ink);
        }

        /* the wordmark stands in for the heading; the text stays for readers */
        h1 {
            height: 26px;
            width: calc(26px * var(--brand-logo-ratio));

            background-image: var(--brand-logo);
            background-repeat: no-repeat;
            background-position: left center;
            background-size: contain;

            text-indent: -9999px;
            overflow: hidden;
            white-space: nowrap;
        }

        p {
            color: var(--ink-soft);
            font-size: 13px;
            max-width: 40ch;
        }

        nav {
            display: flex;
            gap: 12px;
        }

        a {
            padding: 10px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--ink);
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
    </style>
</head>

<body>
    <h1>Report Studio</h1>
    <p>The development playground. Both screens run straight from
        <code>src/</code> with no build step.</p>
    <nav>
        <a href="./designer/">Designer</a>
        <a href="./preview/">Preview</a>
    </nav>
</body>

</html>
