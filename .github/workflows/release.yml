name: Release

# Release routine:
#   npm version patch|minor|major   (bumps package.json, commits, tags vX.Y.Z)
#   git push --follow-tags
on:
  push:
    tags: ['v*']

# One release at a time; never cancel a publish half-way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance and trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      # Pinned to the 11 line rather than @latest: npm 12 changed the shape of
      # `npm pack --json`, and a new npm major should not land in the middle
      # of a release unannounced.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      # Build before test: dist/ is gitignored, and test/package.test.js checks
      # that the dist/ entry points are in the tarball. prepublishOnly runs both
      # again before the upload; running them here as well makes a failure show
      # up as its own step instead of inside the publish log.
      - run: npm run build

      - run: npm test

      # Authenticates through npm trusted publishing (OIDC, the id-token
      # permission above) - there is no npm token, and none should be added.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
