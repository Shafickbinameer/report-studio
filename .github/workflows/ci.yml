name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The dev toolchain sets the floor here, not the package: vite 8 and
        # jsdom 29 need Node ^20.19, vitest 4 needs Node 20+.
        os: [ubuntu-latest]
        node: ['20.x', '22.x', '24.x']
        include:
          # The CLI and the Vite plugin touch the file system, and
          # test/package.test.js has a win32 branch, so run Windows once too.
          - os: windows-latest
            node: '22.x'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # Lists what would go into the tarball without writing it.
      - name: Check package contents
        run: npm pack --dry-run
